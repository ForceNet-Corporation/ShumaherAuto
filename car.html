<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShumaherAuto - Информация</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <style>
        /* Дополнительные стили для слайдера */
        .slider-container {
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 20px 0px;
        }
        .slider-track {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.3s ease;
        }
        .slide {
            background-color: black;
            border: 2px solid red;
            border-radius: 15px;
            opacity: 0.8;
            width: 50%;
            padding: 6px;
            flex-shrink: 0;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }
        .slide-header {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-align: center;
        }
        .slide-divider {
            width: 60px;
            height: 3px;
            background: #b22222;
            border-radius: 10px;
            margin: 0 auto 20px;
        }
        .slide-content {
            color: white;
            font-size: 18px;
            line-height: 2;
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
        }
        .slide-content .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid red;
        }
        .slide-content .row .label {
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            padding-right: 10px;
        }
        .slide-content .row .value {
            font-weight: 500;
        }
        .slide-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: 0.3s;
            cursor: pointer;
        }
        .dot.active {
            background: #b22222;
            width: 30px;
            border-radius: 10px;
        }
        .loading, .not-found {
            text-align: center;
            padding: 40px 0;
            color: rgba(255,255,255,0.3);
        }
        .not-found { font-size: 18px; }
    </style>
</head>
<body>
    <div class="container" style="flex:1; display:flex; flex-direction:column; background: transparent; border: none; padding: 0; margin-bottom:0;">
        <div class="slider-container" id="sliderContainer">
            <div class="slider-track" id="sliderTrack">
                <!-- Слайд 1: Сервис (масло) -->
                <div class="slide" id="slideOil">
                    <div class="slide-header">Сервис</div>
                    <div class="slide-divider"></div>
                    <div class="slide-content" id="oilContent">
                        <div class="loading">Загрузка...</div>
                    </div>
                </div>
                <!-- Слайд 2: Авто -->
                <div class="slide" id="slideCar">
                    <div class="slide-header">Авто</div>
                    <div class="slide-divider"></div>
                    <div class="slide-content" id="carContent">
                        <div class="loading">Загрузка...</div>
                    </div>
                </div>
            </div>
            <div class="slide-dots" id="dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCm9GeIcOtrR3cbWv0fSash5sT7sL9S1rk",
            authDomain: "testwebapp-4db03.firebaseapp.com",
            projectId: "testwebapp-4db03",
            storageBucket: "testwebapp-4db03.firebasestorage.app",
            messagingSenderId: "838164449927",
            appId: "1:838164449927:web:279f3b6e72fdffabde0622"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // СЛАЙДЕР
        // ============================================================
        let currentSlide = 0;
        const track = document.getElementById('sliderTrack');
        const dots = document.querySelectorAll('.dot');
        let touchStartX = 0;
        let touchEndX = 0;

        function goToSlide(index) {
            currentSlide = index;
            track.style.transform = `translateX(-${index * 50}%)`;
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        dots.forEach((dot) => {
            dot.addEventListener('click', () => {
                const index = parseInt(dot.dataset.index);
                goToSlide(index);
            });
        });

        // Свайп
        const container = document.getElementById('sliderContainer');
        container.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentSlide < 1) {
                    goToSlide(currentSlide + 1);
                } else if (diff < 0 && currentSlide > 0) {
                    goToSlide(currentSlide - 1);
                }
            }
        }, { passive: true });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ
        // ============================================================
        function getTagIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function loadCarData() {
            const tagId = getTagIdFromURL();
            const oilContent = document.getElementById('oilContent');
            const carContent = document.getElementById('carContent');

            if (!tagId) {
                oilContent.innerHTML = '<div class="not-found">Отсканируйте NFC-метку</div>';
                carContent.innerHTML = '<div class="not-found">Отсканируйте NFC-метку</div>';
                return;
            }

            oilContent.innerHTML = '<div class="loading">Загрузка...</div>';
            carContent.innerHTML = '<div class="loading">Загрузка...</div>';

            db.collection('clients').doc(tagId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();

                        // Масло
                        oilContent.innerHTML = `
                            <div class="row"><span class="label">Дата замены</span><span class="value">${data.oilChangeDate || '—'}</span></div>
                            <div class="row"><span class="label">Пробег при замене</span><span class="value">${data.oilMileage || '—'} км</span></div>
                            <div class="row"><span class="label">Следующая замена</span><span class="value">${data.nextOilDate || '—'}</span></div>
                            <div class="row"><span class="label">Пробег следующей замены</span><span class="value">${data.nextOilMileage || '—'} км</span></div>
                            <div class="row"><span class="label">Марка масла</span><span class="value">${data.oilBrand || '—'}</span></div>
                        `;

                        // Авто
                        carContent.innerHTML = `
                            <div class="row"><span class="label">Владелец</span><span class="value">${data.name || '—'}</span></div>
                            <div class="row"><span class="label">Автомобиль</span><span class="value">${data.car || '—'}</span></div>
                            <div class="row"><span class="label">Модель</span><span class="value">${data.model || '—'}</span></div>
                            <div class="row"><span class="label">Гос. номер</span><span class="value">${data['gos-num'] || '—'}</span></div>
                            <div class="row"><span class="label">VIN</span><span class="value">${data['vin-num'] || '—'}</span></div>
                            <div class="row"><span class="label">Телефон</span><span class="value">${data.phone || '—'}</span></div>
                            <div class="row"><span class="label">Пробег</span><span class="value">${data.mileage || '—'} км</span></div>
                        `;
                    } else {
                        oilContent.innerHTML = '<div class="not-found">Клиент не найден</div>';
                        carContent.innerHTML = '<div class="not-found">Клиент не найден</div>';
                    }
                })
                .catch((error) => {
                    oilContent.innerHTML = `<div class="not-found">Ошибка: ${error.message}</div>`;
                    carContent.innerHTML = `<div class="not-found">Ошибка: ${error.message}</div>`;
                });
        }

        document.addEventListener('DOMContentLoaded', loadCarData);
    </script>
</body>
</html>
