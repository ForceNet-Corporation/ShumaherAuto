<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarDetector - Админ-панель</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-header">
        <h1>🚗 CarDetector</h1>
        <div>
            <span class="admin-email" id="adminEmailDisplay">admin@autosystem.com</span>
            <button class="logout-btn" onclick="logoutAdmin()">Выйти</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Всего клиентов</div>
            </div>
        </div>

        <div class="admin-panel">
            <div class="panel-header">
                <h2>Список клиентов</h2>
                <button class="btn-add" onclick="openAddModal()">+ Добавить</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Метка (UID)</th>
                            <th>Владелец</th>
                            <th>Автомобиль</th>
                            <th>Телефон</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr><td colspan="5" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <h2>Добавить клиента</h2>
            <label>UID метки</label>
            <input type="text" id="inputTagId" placeholder="TAG_123456789">
            <label>Владелец</label>
            <input type="text" id="inputName" placeholder="Иван Петров">
            <label>Автомобиль</label>
            <input type="text" id="inputCarModel" placeholder="Toyota Camry">
            <label>Телефон</label>
            <input type="text" id="inputPhone" placeholder="+7 999 123-45-67">
            <button class="btn-login" onclick="addClient()">Сохранить</button>
            <div class="error-msg" id="addError">Ошибка</div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
