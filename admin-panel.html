<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarDetector - Админ-панель</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-header">
        <h1>🚗 CarDetector</h1>
        <div>
            <span class="admin-email" id="adminEmailDisplay">admin@autosystem.com</span>
            <button class="logout-btn" onclick="logoutAdmin()">Выйти</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Всего клиентов</div>
            </div>
        </div>

        <div class="admin-panel">
            <div class="panel-header">
                <h2>Список клиентов</h2>
                <button class="btn-add" onclick="openAddModal()">+ Добавить</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Метка (UID)</th>
                            <th>Владелец</th>
                            <th>Автомобиль</th>
                            <th>Телефон</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr><td colspan="5" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <h2>Добавить клиента</h2>
            <label>UID метки</label>
            <input type="text" id="inputTagId" placeholder="TAG_123456789">
            <label>Владелец</label>
            <input type="text" id="inputName" placeholder="Иван Петров">
            <label>Автомобиль</label>
            <input type="text" id="inputCarModel" placeholder="Toyota Camry">
            <label>Телефон</label>
            <input type="text" id="inputPhone" placeholder="+7 999 123-45-67">
            <button class="btn-login" onclick="addClient()">Сохранить</button>
            <div class="error-msg" id="addError">Ошибка</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCm9GeIcOtrR3cbWv0fSash5sT7sL9S1rk",
            authDomain: "testwebapp-4db03.firebaseapp.com",
            projectId: "testwebapp-4db03",
            storageBucket: "testwebapp-4db03.firebasestorage.app",
            messagingSenderId: "838164449927",
            appId: "1:838164449927:web:279f3b6e72fdffabde0622"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = 'az99arseniy@gmail.com';

        auth.onAuthStateChanged((user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('adminEmailDisplay').textContent = user.email;
                loadClients();
            }
        });

        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        function loadClients() {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Загрузка...</td></tr>';

            db.collection('clients').orderBy('name').get()
                .then((snapshot) => {
                    const clients = [];
                    snapshot.forEach((doc) => {
                        clients.push({ id: doc.id, ...doc.data() });
                    });

                    document.getElementById('totalClients').textContent = clients.length;

                    if (clients.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="empty">Нет клиентов</td></tr>';
                        return;
                    }

                    let html = '';
                    clients.forEach((client) => {
                        html += `
                            <tr>
                                <td><span class="tag-id">${client.id}</span></td>
                                <td>${client.name || '—'}</td>
                                <td>${client.carModel || '—'}</td>
                                <td>${client.phone || '—'}</td>
                                <td><button class="btn-delete" onclick="deleteClient('${client.id}')">Удалить</button></td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                })
                .catch(() => {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty">Ошибка загрузки</td></tr>';
                });
        }

        function deleteClient(clientId) {
            if (!confirm(`Удалить клиента ${clientId}?`)) return;
            db.collection('clients').doc(clientId).delete()
                .then(() => loadClients())
                .catch(() => alert('Ошибка удаления'));
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addError').classList.remove('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('inputTagId').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputCarModel').value = '';
            document.getElementById('inputPhone').value = '';
        }

        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        function addClient() {
            const tagId = document.getElementById('inputTagId').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const carModel = document.getElementById('inputCarModel').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const errorEl = document.getElementById('addError');

            if (!tagId || !name || !carModel || !phone) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }

            db.collection('clients').doc(tagId).set({ name, carModel, phone })
                .then(() => {
                    closeAddModal();
                    loadClients();
                })
                .catch((error) => {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    errorEl.classList.add('show');
                });
        }
    </script>
</body>
</html>
