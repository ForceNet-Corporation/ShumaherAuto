<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CarDetector - Админ-панель</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-header">
        <h1>🚗 CarDetector</h1>
        <div>
            <span class="admin-email" id="adminEmailDisplay">admin@autosystem.com</span>
            <button class="logout-btn" onclick="logoutAdmin()">Выйти</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Всего клиентов</div>
            </div>
        </div>

        <div class="admin-panel">
            <div class="panel-header">
                <h2>Список клиентов</h2>
                <button class="btn-add" onclick="openAddModal()">+ Добавить</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Метка (UID)</th>
                            <th>Владелец</th>
                            <th>Автомобиль</th>
                            <th>Модель</th>
                            <th>Гос. номер</th>
                            <th>Телефон</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr><td colspan="7" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <h2>Добавить клиента</h2>
            <label>UID метки</label>
            <input type="text" id="inputTagId" placeholder="ivan">
            <label>Владелец (ФИО)</label>
            <input type="text" id="inputName" placeholder="Иван Петров">
            <label>Автомобиль</label>
            <input type="text" id="inputCar" placeholder="Toyota">
            <label>Модель</label>
            <input type="text" id="inputModel" placeholder="Camry">
            <label>Гос. номер</label>
            <input type="text" id="inputGosNum" placeholder="A123BC">
            <label>VIN номер</label>
            <input type="text" id="inputVin" placeholder="JTDBE32KX60012345">
            <label>Телефон</label>
            <input type="text" id="inputPhone" placeholder="+7 999 123-45-67">
            <label>Пробег</label>
            <input type="text" id="inputMileage" placeholder="15000 км">
            <button class="btn-login" onclick="addClient()">Сохранить</button>
            <div class="error-msg" id="addError">Ошибка</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCm9GeIcOtrR3cbWv0fSash5sT7sL9S1rk",
            authDomain: "testwebapp-4db03.firebaseapp.com",
            projectId: "testwebapp-4db03",
            storageBucket: "testwebapp-4db03.firebasestorage.app",
            messagingSenderId: "838164449927",
            appId: "1:838164449927:web:279f3b6e72fdffabde0622"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // 🔒 СПИСОК АДМИНОВ — ТОЛЬКО ОНИ МОГУТ РАБОТАТЬ С БАЗОЙ
        // ============================================================
        const ADMIN_EMAILS = [
            'az99arseniy@gmail.com',
            'arseniydrummer@gmail.com',
            'alekdavidov@gmail.com'
        ];

        // ============================================================
        // 🔐 ПРОВЕРКА АВТОРИЗАЦИИ
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (!ADMIN_EMAILS.includes(user.email)) {
                auth.signOut();
                alert('⛔ Доступ только для администратора!');
                window.location.href = 'index.html';
            } else {
                document.getElementById('adminEmailDisplay').textContent = user.email;
                loadClients();
            }
        });

        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        function loadClients() {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="empty">Загрузка...</td></tr>';

            db.collection('clients').orderBy('name').get()
                .then((snapshot) => {
                    const clients = [];
                    snapshot.forEach((doc) => {
                        clients.push({ id: doc.id, ...doc.data() });
                    });

                    document.getElementById('totalClients').textContent = clients.length;

                    if (clients.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="empty">Нет клиентов</td></tr>';
                        return;
                    }

                    let html = '';
                    clients.forEach((client) => {
                        html += `
                            <tr>
                                <td><span class="tag-id">${client.id}</span></td>
                                <td>${client.name || '—'}</td>
                                <td>${client.car || '—'}</td>
                                <td>${client.model || '—'}</td>
                                <td>${client['gos-num'] || '—'}</td>
                                <td>${client.phone || '—'}</td>
                                <td><button class="btn-delete" onclick="deleteClient('${client.id}')">Удалить</button></td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                })
                .catch((error) => {
                    console.error('Ошибка загрузки:', error);
                    tbody.innerHTML = '<tr><td colspan="7" class="empty">Ошибка загрузки</td></tr>';
                });
        }

        function deleteClient(clientId) {
            if (!confirm('Удалить клиента ' + clientId + '?')) return;
            db.collection('clients').doc(clientId).delete()
                .then(() => loadClients())
                .catch((error) => {
                    console.error('Ошибка удаления:', error);
                    alert('Ошибка удаления: ' + error.message);
                });
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addError').classList.remove('show');
            document.getElementById('inputTagId').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputCar').value = '';
            document.getElementById('inputModel').value = '';
            document.getElementById('inputGosNum').value = '';
            document.getElementById('inputVin').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputMileage').value = '';
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        function addClient() {
            const tagId = document.getElementById('inputTagId').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const car = document.getElementById('inputCar').value.trim();
            const model = document.getElementById('inputModel').value.trim();
            const gosNum = document.getElementById('inputGosNum').value.trim();
            const vin = document.getElementById('inputVin').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const mileage = document.getElementById('inputMileage').value.trim();
            const errorEl = document.getElementById('addError');

            if (!tagId || !name || !car || !model || !gosNum || !vin || !phone || !mileage) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }

            db.collection('clients').doc(tagId).set({
                name: name,
                car: car,
                model: model,
                'gos-num': gosNum,
                'vin-num': vin,
                phone: phone,
                mileage: mileage
            })
            .then(() => {
                closeAddModal();
                loadClients();
            })
            .catch((error) => {
                console.error('Ошибка добавления:', error);
                errorEl.textContent = 'Ошибка: ' + error.message;
                errorEl.classList.add('show');
            });
        }
    </script>
</body>
</html>
