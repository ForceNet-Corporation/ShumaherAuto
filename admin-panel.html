<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShumaherAuto - Админ-панель</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <style>
        body {
            background-image: url={'assets/back.jpg');
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="header-left">
            <img src="assets/shum-logo.png" alt="logo" class="header-logo">
            <span style="font-size:22px; font-weight:800; letter-spacing:-0.5px;">
                <span style="color:#b22222;">Shumaher</span><span style="color:#ffffff;">Auto</span>
            </span>
        </div>
        <div>
            <span class="admin-email" id="adminEmailDisplay">admin</span>
            <button class="logout-btn" onclick="logoutAdmin()">Выйти</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Клиентов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCars">0</div>
                <div class="stat-label">Авто</div>
            </div>
        </div>

        <div class="admin-panel">
            <div class="panel-header">
                <h2>Клиенты <span class="count" id="clientsCount"></span></h2>
                <button class="btn-add" onclick="openStep1()">+ Добавить</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Метка</th>
                            <th>Владелец</th>
                            <th>Автомобиль</th>
                            <th>Гос. номер</th>
                            <th style="text-align:center;">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr><td colspan="5" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ШАГ 1 (МАСЛО) -->
    <div class="modal-overlay" id="step1Modal">
        <div class="modal">
            <button class="modal-close" onclick="closeStep1()">×</button>
            <h2>🛢️ Данные о масле</h2>
            <p class="modal-sub">Шаг 1 из 2</p>
            <label>Дата замены масла</label>
            <input type="text" id="oilChangeDate" placeholder="15.08.2026">
            <label>Пробег при замене (км)</label>
            <input type="text" id="oilMileage" placeholder="15000">
            <label>Дата следующей замены</label>
            <input type="text" id="nextOilDate" placeholder="15.11.2026">
            <label>Пробег следующей замены (км)</label>
            <input type="text" id="nextOilMileage" placeholder="20000">
            <label>Марка масла</label>
            <input type="text" id="oilBrand" placeholder="Castrol Magnatec 5W-30">
            <button class="btn-login" onclick="openStep2()">Далее ➜</button>
            <div class="error-msg" id="step1Error">Ошибка</div>
        </div>
    </div>

    <!-- МОДАЛКА ШАГ 2 (ОСНОВНЫЕ) -->
    <div class="modal-overlay" id="step2Modal">
        <div class="modal">
            <button class="modal-close" onclick="closeStep2()">×</button>
            <h2>🚗 Основные данные</h2>
            <p class="modal-sub">Шаг 2 из 2</p>
            <label>UID метки</label>
            <input type="text" id="inputTagId" placeholder="ivan">
            <label>Владелец (ФИО)</label>
            <input type="text" id="inputName" placeholder="Иван Петров">
            <label>Автомобиль</label>
            <input type="text" id="inputCar" placeholder="Toyota">
            <label>Модель</label>
            <input type="text" id="inputModel" placeholder="Camry">
            <label>Гос. номер</label>
            <input type="text" id="inputGosNum" placeholder="A123BC">
            <label>VIN номер</label>
            <input type="text" id="inputVin" placeholder="JTDBE32KX60012345">
            <label>Телефон</label>
            <input type="text" id="inputPhone" placeholder="+7 999 123-45-67">
            <label>Пробег (км)</label>
            <input type="text" id="inputMileage" placeholder="15000">
            <button class="btn-login" onclick="addClient()">Сохранить</button>
            <button class="btn-login secondary" onclick="goBackStep1()">← Назад</button>
            <div class="error-msg" id="step2Error">Ошибка</div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="modal-close" onclick="closeEditModal()">×</button>
            <h2>✏️ Редактировать</h2>
            <p class="modal-sub" id="editClientName">Клиент</p>
            <div class="edit-tabs">
                <button class="active" onclick="switchEditTab('oil')">Масло</button>
                <button onclick="switchEditTab('main')">Основное</button>
            </div>
            <div id="editOilData">
                <label>Дата замены масла</label>
                <input type="text" id="editOilChangeDate" placeholder="15.08.2026">
                <label>Пробег при замене (км)</label>
                <input type="text" id="editOilMileage" placeholder="15000">
                <label>Дата следующей замены</label>
                <input type="text" id="editNextOilDate" placeholder="15.11.2026">
                <label>Пробег следующей замены (км)</label>
                <input type="text" id="editNextOilMileage" placeholder="20000">
                <label>Марка масла</label>
                <input type="text" id="editOilBrand" placeholder="Castrol Magnatec 5W-30">
            </div>
            <div id="editMainData" style="display:none;">
                <label>Владелец (ФИО)</label>
                <input type="text" id="editName" placeholder="Иван Петров">
                <label>Автомобиль</label>
                <input type="text" id="editCar" placeholder="Toyota">
                <label>Модель</label>
                <input type="text" id="editModel" placeholder="Camry">
                <label>Гос. номер</label>
                <input type="text" id="editGosNum" placeholder="A123BC">
                <label>VIN номер</label>
                <input type="text" id="editVin" placeholder="JTDBE32KX60012345">
                <label>Телефон</label>
                <input type="text" id="editPhone" placeholder="+7 999 123-45-67">
                <label>Пробег (км)</label>
                <input type="text" id="editMileage" placeholder="15000">
            </div>
            <button class="btn-login" onclick="saveEdit()">💾 Сохранить</button>
            <div class="error-msg" id="editError">Ошибка</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCm9GeIcOtrR3cbWv0fSash5sT7sL9S1rk",
            authDomain: "testwebapp-4db03.firebaseapp.com",
            projectId: "testwebapp-4db03",
            storageBucket: "testwebapp-4db03.firebasestorage.app",
            messagingSenderId: "838164449927",
            appId: "1:838164449927:web:279f3b6e72fdffabde0622"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const ADMIN_EMAILS = ['az99arseniy@gmail.com', 'alekdavidov@gmail.com'];

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else if (!ADMIN_EMAILS.includes(user.email)) {
                auth.signOut();
                alert('⛔ Доступ только для администратора!');
                window.location.href = 'index.html';
            } else {
                document.getElementById('adminEmailDisplay').textContent = user.email;
                loadClients();
            }
        });

        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        function loadClients() {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Загрузка...</td></tr>';

            db.collection('clients').orderBy('name').get()
                .then((snapshot) => {
                    const clients = [];
                    snapshot.forEach((doc) => {
                        clients.push({ id: doc.id, ...doc.data() });
                    });

                    document.getElementById('totalClients').textContent = clients.length;
                    document.getElementById('totalCars').textContent = clients.length;
                    document.getElementById('clientsCount').textContent = `(${clients.length})`;

                    if (clients.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="empty">Нет клиентов</td></tr>';
                        return;
                    }

                    let html = '';
                    clients.forEach((client) => {
                        html += `
                            <tr>
                                <td><span class="tag-id">${client.id}</span></td>
                                <td>${client.name || '—'}</td>
                                <td>${client.car || '—'}</td>
                                <td>${client['gos-num'] || '—'}</td>
                                <td style="text-align:center; white-space:nowrap;">
                                    <button class="btn-edit" onclick="openEdit('${client.id}')">Изменить</button>
                                    <button class="btn-delete" onclick="deleteClient('${client.id}')">Удалить</button>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                })
                .catch((error) => {
                    console.error('Ошибка загрузки:', error);
                    tbody.innerHTML = '<tr><td colspan="5" class="empty">Ошибка загрузки</td></tr>';
                });
        }

        // ДОБАВЛЕНИЕ
        let tempOilData = {};

        function openStep1() {
            document.getElementById('step1Modal').classList.add('active');
            document.getElementById('step1Error').classList.remove('show');
            ['oilChangeDate', 'oilMileage', 'nextOilDate', 'nextOilMileage', 'oilBrand'].forEach(id => {
                document.getElementById(id).value = '';
            });
        }

        function closeStep1() {
            document.getElementById('step1Modal').classList.remove('active');
        }

        function openStep2() {
            const oilChangeDate = document.getElementById('oilChangeDate').value.trim();
            const oilMileage = document.getElementById('oilMileage').value.trim();
            const nextOilDate = document.getElementById('nextOilDate').value.trim();
            const nextOilMileage = document.getElementById('nextOilMileage').value.trim();
            const oilBrand = document.getElementById('oilBrand').value.trim();
            const errorEl = document.getElementById('step1Error');

            if (!oilChangeDate || !oilMileage || !nextOilDate || !nextOilMileage || !oilBrand) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }

            tempOilData = { oilChangeDate, oilMileage, nextOilDate, nextOilMileage, oilBrand };
            closeStep1();
            document.getElementById('step2Modal').classList.add('active');
            document.getElementById('step2Error').classList.remove('show');
            ['inputTagId', 'inputName', 'inputCar', 'inputModel', 'inputGosNum', 'inputVin', 'inputPhone', 'inputMileage']
                .forEach(id => document.getElementById(id).value = '');
        }

        function goBackStep1() {
            closeStep2();
            openStep1();
        }

        function closeStep2() {
            document.getElementById('step2Modal').classList.remove('active');
        }

        function addClient() {
            const tagId = document.getElementById('inputTagId').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const car = document.getElementById('inputCar').value.trim();
            const model = document.getElementById('inputModel').value.trim();
            const gosNum = document.getElementById('inputGosNum').value.trim();
            const vin = document.getElementById('inputVin').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const mileage = document.getElementById('inputMileage').value.trim();
            const errorEl = document.getElementById('step2Error');

            if (!tagId || !name || !car || !model || !gosNum || !vin || !phone || !mileage) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }

            const fullData = {
                name, car, model, 'gos-num': gosNum, 'vin-num': vin, phone, mileage,
                ...tempOilData
            };

            db.collection('clients').doc(tagId).set(fullData)
                .then(() => {
                    closeStep2();
                    loadClients();
                    tempOilData = {};
                })
                .catch((error) => {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    errorEl.classList.add('show');
                });
        }

        // УДАЛЕНИЕ
        function deleteClient(clientId) {
            if (!confirm('Удалить клиента?')) return;
            db.collection('clients').doc(clientId).delete()
                .then(() => loadClients())
                .catch((error) => {
                    alert('Ошибка удаления: ' + error.message);
                });
        }

        // РЕДАКТИРОВАНИЕ
        let editClientId = null;
        let editTab = 'oil';

        function openEdit(clientId) {
            editClientId = clientId;
            document.getElementById('editModal').classList.add('active');
            document.getElementById('editError').classList.remove('show');
            switchEditTab('oil');
            
            db.collection('clients').doc(clientId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('editOilChangeDate').value = data.oilChangeDate || '';
                        document.getElementById('editOilMileage').value = data.oilMileage || '';
                        document.getElementById('editNextOilDate').value = data.nextOilDate || '';
                        document.getElementById('editNextOilMileage').value = data.nextOilMileage || '';
                        document.getElementById('editOilBrand').value = data.oilBrand || '';
                        document.getElementById('editName').value = data.name || '';
                        document.getElementById('editCar').value = data.car || '';
                        document.getElementById('editModel').value = data.model || '';
                        document.getElementById('editGosNum').value = data['gos-num'] || '';
                        document.getElementById('editVin').value = data['vin-num'] || '';
                        document.getElementById('editPhone').value = data.phone || '';
                        document.getElementById('editMileage').value = data.mileage || '';
                        document.getElementById('editClientName').textContent = data.name || 'Клиент';
                    }
                })
                .catch((error) => {
                    alert('Ошибка загрузки: ' + error.message);
                });
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editClientId = null;
        }

        function switchEditTab(tab) {
            editTab = tab;
            const oilDiv = document.getElementById('editOilData');
            const mainDiv = document.getElementById('editMainData');
            const buttons = document.querySelectorAll('.edit-tabs button');
            
            if (tab === 'oil') {
                oilDiv.style.display = 'block';
                mainDiv.style.display = 'none';
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                oilDiv.style.display = 'none';
                mainDiv.style.display = 'block';
                buttons[1].classList.add('active');
                buttons[0].classList.remove('active');
            }
        }

        function saveEdit() {
            if (!editClientId) return;
            const errorEl = document.getElementById('editError');
            
            const oilData = {
                oilChangeDate: document.getElementById('editOilChangeDate').value.trim(),
                oilMileage: document.getElementById('editOilMileage').value.trim(),
                nextOilDate: document.getElementById('editNextOilDate').value.trim(),
                nextOilMileage: document.getElementById('editNextOilMileage').value.trim(),
                oilBrand: document.getElementById('editOilBrand').value.trim()
            };
            
            const mainData = {
                name: document.getElementById('editName').value.trim(),
                car: document.getElementById('editCar').value.trim(),
                model: document.getElementById('editModel').value.trim(),
                'gos-num': document.getElementById('editGosNum').value.trim(),
                'vin-num': document.getElementById('editVin').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                mileage: document.getElementById('editMileage').value.trim()
            };

            if (editTab === 'oil') {
                if (!oilData.oilChangeDate || !oilData.oilMileage || !oilData.nextOilDate || !oilData.nextOilMileage || !oilData.oilBrand) {
                    errorEl.textContent = 'Заполните все поля масла!';
                    errorEl.classList.add('show');
                    return;
                }
            } else {
                if (!mainData.name || !mainData.car || !mainData.model || !mainData['gos-num'] || !mainData['vin-num'] || !mainData.phone || !mainData.mileage) {
                    errorEl.textContent = 'Заполните все основные поля!';
                    errorEl.classList.add('show');
                    return;
                }
            }

            const updateData = { ...oilData, ...mainData };
            db.collection('clients').doc(editClientId).update(updateData)
                .then(() => {
                    closeEditModal();
                    loadClients();
                })
                .catch((error) => {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    errorEl.classList.add('show');
                });
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
