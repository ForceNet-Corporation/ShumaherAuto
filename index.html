<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarDetector</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container" id="carInfo">
        <ul id="carList">
            <li>Поднесите NFC-метку к телефону</li>
        </ul>
    </div>
    <div class="down">
        <button class="reg" onclick="openLoginModal()">Войти</button>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <button class="modal-close" onclick="closeLoginModal()">×</button>
            <h2>Вход в админ-панель</h2>
            <label>Email</label>
            <input type="email" id="adminEmail" placeholder="Введите email">
            <label>Пароль</label>
            <input type="password" id="adminPassword" placeholder="Введите пароль" onkeydown="if(event.key==='Enter') loginAdmin()">
            <button class="btn-login" onclick="loginAdmin()">Войти</button>
            <div class="error-msg" id="loginError">Неверный email или пароль</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCm9GeIcOtrR3cbWv0fSash5sT7sL9S1rk",
            authDomain: "testwebapp-4db03.firebaseapp.com",
            projectId: "testwebapp-4db03",
            storageBucket: "testwebapp-4db03.firebasestorage.app",
            messagingSenderId: "838164449927",
            appId: "1:838164449927:web:279f3b6e72fdffabde0622"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAIL = 'az99arseniy@gmail.com';

        function getTagIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function loadCarData() {
            const tagId = getTagIdFromURL();
            const list = document.getElementById('carList');

            if (!tagId) {
                list.innerHTML = '<li>Отсканируйте NFC-метку</li>';
                return;
            }

            list.innerHTML = '<li>Загрузка...</li>';

            db.collection('clients').doc(tagId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        list.innerHTML = `
                            <li><strong>Владелец:</strong> ${data.name || 'Не указано'}</li>
                            <li><strong>Автомобиль:</strong> ${data.car || 'Не указано'}</li>
                            <li><strong>Модель:</strong> ${data.model || 'Не указана'}</li>
                            <li><strong>Гос. номер:</strong> ${data['gos-num'] || 'Не указан'}</li>
                            <li><strong>VIN:</strong> ${data['vin-num'] || 'Не указан'}</li>
                            <li><strong>Телефон:</strong> ${data.phone || 'Не указан'}</li>
                            <li><strong>Пробег:</strong> ${data.mileage || 'Не указан'}</li>
                        `;
                    } else {
                        list.innerHTML = `<li>Клиент с меткой ${tagId} не найден</li>`;
                    }
                })
                .catch(() => {
                    list.innerHTML = '<li>Ошибка загрузки данных</li>';
                });
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('adminEmail').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.remove('show');
        }

        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        function loginAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!email || !password) {
                errorEl.textContent = 'Заполните все поля!';
                errorEl.classList.add('show');
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    if (userCredential.user.email === ADMIN_EMAIL) {
                        window.location.href = 'admin-panel.html';
                    } else {
                        auth.signOut();
                        errorEl.textContent = 'Доступ только для администратора!';
                        errorEl.classList.add('show');
                    }
                })
                .catch((error) => {
                    let msg = error.message;
                    if (msg.includes('user-not-found')) msg = 'Пользователь не найден';
                    else if (msg.includes('wrong-password')) msg = 'Неверный пароль';
                    errorEl.textContent = msg;
                    errorEl.classList.add('show');
                });
        }

        document.addEventListener('DOMContentLoaded', loadCarData);
    </script>
</body>
</html>
