<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Поиск по карте</title>
</head>
<body>
    <h2>Приложите NFC-метку</h2>
    
    <input type="text" id="nfcInput" placeholder="Данные с метки..." style="width:300px;">
    <button onclick="searchByNFC()">🔍 Поиск</button>
    
    <div id="result" style="margin-top:20px; border:1px solid #ccc; padding:15px; display:none;">
        <p><strong>Госномер:</strong> <span id="display-gos-num"></span></p>
        <p><strong>Авто:</strong> <span id="display-car"></span></p>
        <p><strong>Модель:</strong> <span id="display-model"></span></p>
        <p><strong>VIN:</strong> <span id="display-vin-num"></span></p>
        <p><strong>Телефон:</strong> <span id="display-phone"></span></p>
        <p><strong>ФИО:</strong> <span id="display-name"></span></p>
        <p><strong>Пробег:</strong> <span id="display-mileage"></span> км</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 🔧 Ваша конфигурация Firebase
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
            databaseURL: "https://ВАШ_ПРОЕКТ-default-rtdb.firebaseio.com",
            projectId: "ВАШ_ПРОЕКТ",
            storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ⚡ Главная функция поиска
        function searchByNFC() {
            const key = document.getElementById('nfcInput').value.trim();
            
            if (!key) {
                alert('Сначала приложите метку или введите ключ вручную');
                return;
            }

            db.ref().child(key).once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    
                    if (data && typeof data === 'object') {
                        document.getElementById('display-gos-num').textContent = data['gos-num'] || '—';
                        document.getElementById('display-car').textContent = data.car || '—';
                        document.getElementById('display-model').textContent = data.model || '—';
                        document.getElementById('display-vin-num').textContent = data['vin-num'] || '—';
                        document.getElementById('display-phone').textContent = data.phone || '—';
                        document.getElementById('display-name').textContent = data.name || '—';
                        document.getElementById('display-mileage').textContent = data.mileage || '—';
                        
                        document.getElementById('result').style.display = 'block';
                    } else {
                        alert('❌ Данные по этому ключу не найдены');
                        document.getElementById('result').style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    alert('⚠️ Ошибка подключения к Firebase');
                });
        }

        document.getElementById('nfcInput').addEventListener('change', function() {
            if (this.value.trim()) {
                searchByNFC();
            }
        });
    </script>
</body>
</html>
